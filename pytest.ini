[pytest]
# 只收这两个套件：仓库根直接 `pytest` 曾递归 tmp/（527 个 py）与
# local_models/MuseTalk（4345 个 test_*.py），10 分钟不出结果。
testpaths = tests pipeline/tests
norecursedirs = tmp local_models outputs frontend tools .git .pytest_cache docs
# tests/ 里有 3 个模块 import app.*（需要 backend/ 在 sys.path），由 tests/conftest.py 负责注入。
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
